spring.application.name=sentinel-ai-backend
server.port=8080

# Conexión a PostgreSQL (se puede cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentinel_ai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo crea /sql/01_schema.sql; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
