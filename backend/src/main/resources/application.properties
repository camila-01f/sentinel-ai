spring.application.name=sentinel-ai-backend
server.port=8080

# Conexión a PostgreSQL (se puede cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentinel_ai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo crea /sql/01_schema.sql; Hibernate solo valida que coincida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Seguridad JWT. En producción defina JWT_SECRET (Base64, mínimo 32 bytes)
sentinel.jwt.secret=${JWT_SECRET:c2VudGluZWwtYWktY2xhdmUtZGUtZGVzYXJyb2xsby1zb2xvLXBhcmEtcHJ1ZWJhcy0yMDI2}
sentinel.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}
